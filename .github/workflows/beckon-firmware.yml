name: Beckon firmware

on:
  push:
    branches: [beckon/main]
    paths:
      [
        "beckon/**",
        "app/**",
        "nix/**",
        "default.nix",
        ".github/workflows/beckon-*.yml",
      ]
  pull_request:
    branches: [beckon/main]
    paths:
      [
        "beckon/**",
        "app/**",
        "nix/**",
        "default.nix",
        ".github/workflows/beckon-*.yml",
      ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: beckon-firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    uses: ./.github/workflows/test.yml
  ble-tests:
    uses: ./.github/workflows/ble-test.yml
  nix-build:
    uses: ./.github/workflows/nix-build.yml
  docs:
    uses: ./.github/workflows/doc-checks.yml
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lint owned workflows and shell scripts
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12 \
            .github/workflows/beckon-firmware.yml \
            .github/workflows/beckon-workflow-lint.yml \
            .github/workflows/prepare-beckon-candidate.yml \
            .github/workflows/release-beckon.yml \
            .github/workflows/check-upstream.yml
          shellcheck beckon/scripts/build-west.sh beckon/scripts/publish-candidate.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check repository formatting
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --all-files
      - name: Test candidate packaging and publish failures
        run: |
          python3 -m pip install west==1.3.0
          python3 -m unittest discover -s beckon/tests -p 'test_release.py' -v

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Restore West dependencies
        uses: actions/cache@v6
        with:
          path: |
            modules
            tools
            zephyr
            bootloader
          key: ${{ runner.os }}-beckon-west-${{ hashFiles('app/west.yml', 'nix/*.patch', 'beckon/patches/*.patch') }}
        timeout-minutes: 2
        continue-on-error: true
      - name: Build both halves and verify firmware
        run: ./beckon/scripts/build-west.sh
      - name: Upload checked firmware and provenance
        uses: actions/upload-artifact@v7
        with:
          name: beckon-glove80-uf2
          path: |
            beckon/glove80.uf2
            beckon/build.log
            beckon/source.json
            beckon/west-frozen.yml
          if-no-files-found: error
          retention-days: 30

  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beckon/main'
    needs: [build, source-tests, ble-tests, nix-build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: beckon-glove80-uf2
          path: candidate
      - name: Package and publish checked candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ vars.BECKON_RELEASE_TAG || 'v0.2.0' }}
          BECKON_NOTIFY_USER: ${{ vars.BECKON_NOTIFY_USER || github.repository_owner }}
        run: |
          python3 beckon/scripts/candidate.py candidate "$RELEASE_TAG" "$RELEASE_TAG-rc.$GITHUB_RUN_ID"
          ./beckon/scripts/publish-candidate.sh candidate
