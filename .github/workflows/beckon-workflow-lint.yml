name: Beckon workflow lint

on:
  pull_request:
    branches: [beckon/main]
    paths:
      - ".github/workflows/beckon-*.yml"
      - ".github/workflows/check-upstream.yml"
      - ".github/workflows/prepare-beckon-candidate.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/release-beckon.yml"
  push:
    branches: [beckon/main]
    paths:
      - ".github/workflows/beckon-*.yml"
      - ".github/workflows/check-upstream.yml"
      - ".github/workflows/prepare-beckon-candidate.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/release-beckon.yml"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Beckon-owned workflows
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12 \
            .github/workflows/beckon-firmware.yml \
            .github/workflows/beckon-workflow-lint.yml \
            .github/workflows/prepare-beckon-candidate.yml \
            .github/workflows/release-beckon.yml \
            .github/workflows/check-upstream.yml \
            .github/workflows/pre-commit.yml
