name: Check MoErgo upstream

on:
  schedule:
    - cron: "23 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beckon-upstream-sync
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: beckon/main
          fetch-depth: 0
      - name: Fetch MoErgo main
        run: |
          git remote add upstream https://github.com/moergo-sc/zmk.git
          git fetch upstream main --tags
          # GitHub PR merges add a merge commit to main. Future upstream updates
          # must preserve that ancestry rather than requiring a fast-forward.
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            merge --no-edit upstream/main
      - name: Propose upstream update for Beckon
        id: proposal
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-moergo-upstream
          delete-branch: true
          title: "chore: sync MoErgo upstream"
          commit-message: "chore: sync MoErgo upstream"
          body: |
            Automated merge of MoErgo upstream into `beckon/main`. The Beckon
            firmware build runs on this branch automatically. Merging publishes a
            firmware candidate; physically test both halves before promoting it.
          base: beckon/main
      # PRs opened with the default token do not trigger pull_request workflows,
      # so start the firmware build on the proposal branch explicitly.
      - name: Build firmware for the proposal
        if: steps.proposal.outputs.pull-request-operation == 'created' || steps.proposal.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run beckon-firmware.yml --repo "$GITHUB_REPOSITORY" --ref automation/sync-moergo-upstream
