name: Check MoErgo upstream

on:
  schedule:
    - cron: "23 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beckon-upstream-sync
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch MoErgo main
        run: |
          git remote add upstream https://github.com/moergo-sc/zmk.git
          git fetch upstream main --tags
          git merge --ff-only upstream/main
      - name: Propose upstream mirror update
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-moergo-upstream
          delete-branch: true
          title: "chore: sync MoErgo upstream"
          commit-message: "chore: sync MoErgo upstream"
          body: |
            Automated fast-forward of the upstream mirror. Merge this first,
            then merge `main` into `beckon/main`, run firmware CI, and physically test
            both halves before making a release.
          base: main
