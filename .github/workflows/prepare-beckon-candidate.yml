name: Prepare Beckon firmware candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Final release tag (for example v0.2.0)"
        required: true
        type: string
      candidate_tag:
        description: "Candidate tag (for example v0.2.0-rc.6)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/beckon-firmware.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: beckon-glove80-uf2
          path: candidate
      - name: Package and publish checked candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          BECKON_NOTIFY_USER: ${{ vars.BECKON_NOTIFY_USER || github.repository_owner }}
        run: |
          python3 beckon/scripts/candidate.py candidate "$RELEASE_TAG" "$CANDIDATE_TAG"
          ./beckon/scripts/wait-for-ci.sh "$(jq -er .commit candidate/candidate.json)"
          ./beckon/scripts/publish-candidate.sh candidate
