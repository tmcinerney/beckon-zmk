name: Release Beckon firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, matching beckon/manifest.toml (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beckon/main
      - name: Initialize upstream build workspace
        run: |
          west init -l app
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Build both halves and combine UF2
        run: |
          west build -s app -d build/beckon-lh -b glove80_lh -- \
            -DKEYMAP_FILE="$GITHUB_WORKSPACE/beckon/config/beckon.keymap" \
            -DEXTRA_CONF_FILE="$GITHUB_WORKSPACE/beckon/config/beckon.conf" 2>&1 | tee beckon/lh-build.log
          west build -s app -d build/beckon-rh -b glove80_rh -- \
            -DKEYMAP_FILE="$GITHUB_WORKSPACE/beckon/config/beckon.keymap" \
            -DEXTRA_CONF_FILE="$GITHUB_WORKSPACE/beckon/config/beckon.conf" 2>&1 | tee beckon/rh-build.log
          cat build/beckon-lh/zephyr/zmk.uf2 build/beckon-rh/zephyr/zmk.uf2 > beckon/glove80.uf2
          cat beckon/lh-build.log beckon/rh-build.log > beckon/build.log
      - name: Run firmware checks
        run: |
          ./beckon/tests/test-checks.sh
          ./beckon/tests/check-memory.sh beckon/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: release-glove80-uf2
          path: beckon/glove80.uf2
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beckon/main
      - name: Verify requested release version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^firmware_version = "\(.*\)"$/\1/p' beckon/manifest.toml)
          test "v${version}" = "$TAG"
      - uses: actions/download-artifact@v4
        with:
          name: release-glove80-uf2
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" release/glove80.uf2 \
            --title "Beckon $TAG" \
            --generate-notes
