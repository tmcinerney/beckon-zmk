name: Promote Beckon firmware candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Final release tag matching the candidate metadata (for example v0.1.0)"
        required: true
        type: string
      candidate_tag:
        description: "Tested candidate tag (for example v0.1.0-rc.1)"
        required: true
        type: string
      physical_smoke_tested:
        description: "I flashed both halves and completed the physical smoke test"
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download and verify tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PHYSICAL_SMOKE_TESTED: ${{ inputs.physical_smoke_tested }}
        run: |
          test "$PHYSICAL_SMOKE_TESTED" = true
          mkdir release
          gh release download "$CANDIDATE_TAG" --pattern beckon.uf2 --pattern SHA256SUMS \
            --pattern candidate.json --pattern SMOKE-TEST.md --dir release
          (cd release && sha256sum --check SHA256SUMS)
          test "$(jq -r .release_tag release/candidate.json)" = "$RELEASE_TAG"
          test "$(jq -r .candidate_tag release/candidate.json)" = "$CANDIDATE_TAG"
          commit=$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' release/candidate.json)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_TAG" --jq .sha)" = "$commit"
          test "$(jq -er .sha256 release/candidate.json)" = "$(sha256sum release/beckon.uf2 | cut -d ' ' -f 1)"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          commit=$(jq -r .commit release/candidate.json)
          git tag "$RELEASE_TAG" "$commit"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            release/beckon.uf2 release/SHA256SUMS release/candidate.json release/SMOKE-TEST.md \
            --title "Beckon $RELEASE_TAG" \
            --generate-notes
