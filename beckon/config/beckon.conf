# The layout itself is in beckon.keymap. Keep device-wide defaults in the
# upstream board configuration unless Beckon requires a deliberate override.
# Compile the small renderer on both halves. Only the central enables Raw HID;
# the peripheral gets snapshots through the authenticated split service.
CONFIG_BECKON_STATUS_LED_PROOF=y
CONFIG_BECKON_STATUS_SPLIT_SYNC=y
