# The Raw HID module supplies one vendor-defined, fixed-size report endpoint on
# the USB-connected split central. It is deliberately not enabled on the right
# (peripheral) half.
CONFIG_RAW_HID=y
CONFIG_RAW_HID_USAGE_PAGE=0xFF60
CONFIG_RAW_HID_USAGE=0x61
CONFIG_RAW_HID_REPORT_SIZE=32
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_BECKON_STATUS_TRANSPORT=y
